name: Tägliche Aktualisierung

# Läuft auf GitHub-Servern - unabhängig davon, ob der eigene Rechner an ist.
#
# Zwei Zeitpläne: Werktags werden nur Seiten neu geholt, deren Zwischenspeicher
# älter als 24 Stunden ist. Sonntagnacht läuft derselbe Weg mit --frisch, holt
# also jede Seite neu und löscht anschließend, was der Lauf nicht angefasst hat.
# Ohne das blieben stille Korrekturen der Quellen unbemerkt und der Speicher
# würde mit jedem verschwundenen Festival weiterwachsen.
#
# Ein Push ist die dritte Laufart und die kürzeste: Er ändert Code, keine
# Termine. Gebaut und veröffentlicht wird aus dem Bestand der letzten Nacht,
# gesammelt wird nicht — das erspart den zwölf Quellen einen Abruf je Commit.
on:
  schedule:
    - cron: "17 3 * * 1-6"      # Mo-Sa 03:17 UTC (04:17 bzw. 05:17 deutscher Zeit)
    - cron: "17 2 * * 0"        # sonntags 02:17 UTC: kompletter Neuabruf
  workflow_dispatch:             # zusätzlich jederzeit von Hand startbar
    inputs:
      frisch:
        description: "Alles neu abrufen statt nur Veraltetes"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  # Schreiben, weil der Lauf die Chronik fortschreibt - eine Zeile je Monat.
  # Ein Push mit dem GITHUB_TOKEN loest keinen Workflow aus (GitHub verhindert
  # die Rekursion); der "push"-Ausloeser oben greift dabei also nicht. Wer das
  # spaeter auf einen persoenlichen Token umstellt, baut sich eine Schleife.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install requests beautifulsoup4 pillow pytest

      # Erst prüfen, dann sammeln: Ein Fehler in der Logik soll auffallen,
      # bevor er sich in die veröffentlichten Daten schreibt.
      - name: Tests
        run: python -m pytest tests -q

      # Der Seiten-Cache spart Abrufe bei den Quellen, der Geo-Cache spart
      # Nominatim-Anfragen. Ohne ihn liefe jeder Tag von vorn.
      # Getrennt zurueckholen und ablegen: Ein Push-Lauf holt nichts Neues,
      # also gibt es auch nichts abzulegen. Sonst wuechse mit jedem Commit ein
      # weiterer Speicherstand von einem halben Gigabyte heran.
      - name: Zwischenspeicher zurückholen
        id: speicher
        uses: actions/cache/restore@v6
        with:
          path: |
            cache
            data/festivals.json
            data/lauf.json
            data/geo.json
            data/gazetteer.json
            data/plz.json
            data/verortung.json
            data/quellen_stand.json
            data/preis_verlauf.json
            data/bestand_verlauf.json
            data/welt_grob.json
            data/welt_fein.json
          key: festival-cache-${{ github.run_id }}
          restore-keys: festival-cache-

      # Drei Laufarten. Ein Push laesst nur das Sammeln weg - erzeugt aber
      # alles Uebrige neu, denn site/fonts.css und die Symbole entstehen in
      # eigenen Schritten und werden nicht mitversioniert. Fehlt der Bestand
      # der letzten Nacht (Zwischenspeicher abgelaufen), gaebe es nichts zu
      # bauen: dann der volle Lauf.
      - name: Laufart bestimmen
        id: art
        run: |
          if [ "${{ github.event.schedule }}" = "17 2 * * 0" ] \
             || [ "${{ inputs.frisch }}" = "true" ]; then
            echo "befehl=alles --frisch" >> "$GITHUB_OUTPUT"
            echo "Kompletter Neuabruf"
          elif [ "${{ github.event_name }}" = "push" ] && [ -s data/festivals.json ]; then
            echo "befehl=alles --ohne-sammeln" >> "$GITHUB_OUTPUT"
            echo "Ohne Sammeln - es gilt der Bestand der letzten Nacht"
          else
            echo "befehl=alles" >> "$GITHUB_OUTPUT"
            echo "Voller Lauf, nur Veraltetes nachladen"
          fi

      # Die Reihenfolge der Schritte steht in festivalfinder/cli.py - damit
      # ein Lauf hier und ein Lauf am eigenen Rechner dasselbe tun.
      - name: Datenlauf
        run: |
          set -o pipefail
          python -m festivalfinder ${{ steps.art.outputs.befehl }} 2>&1 | tee /tmp/lauf.log

      # Welcher der sechs Teilschritte gescheitert ist, stand bisher nur im
      # Protokoll - und da sieht niemand nach, der nur die Fehlermeldung
      # "exit code 1" vor sich hat. befehl_alles schreibt zu jedem Schritt eine
      # Zeile; die gehoert in die Zusammenfassung.
      - name: Woran es lag
        if: failure()
        run: |
          {
            echo "### Der Lauf ist gescheitert"
            echo '```'
            grep -E "^\[|FEHLER|Traceback|Error" /tmp/lauf.log | tail -40 || true
            echo "--- die letzten Zeilen ---"
            tail -25 /tmp/lauf.log || echo "kein Protokoll"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Nur nach einem Sammellauf: Ein Bauschritt hat nichts geholt.
      - name: Zwischenspeicher ablegen
        if: steps.art.outputs.befehl != 'alles --ohne-sammeln'
        uses: actions/cache/save@v6
        with:
          path: |
            cache
            data/festivals.json
            data/lauf.json
            data/geo.json
            data/gazetteer.json
            data/plz.json
            data/verortung.json
            data/quellen_stand.json
            data/preis_verlauf.json
            data/bestand_verlauf.json
            data/welt_grob.json
            data/welt_fein.json
          key: festival-cache-${{ github.run_id }}

      # Warnungen sollen sichtbar sein, ohne dass jemand ins Protokoll steigt.
      - name: Protokoll in die Zusammenfassung
        if: always()
        run: |
          {
            echo "### ${{ steps.art.outputs.befehl }}"
            echo '```'
            python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("data/lauf.json")
          if not p.exists():
              print("Kein Datenlauf und kein alter Bericht."); raise SystemExit
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"Stand {d['stand']} - {d['festivals']} Festivals")
          for name, n in d["quellen"].items():
              print(f"  {name:<18} {n:>6}")
          for w in d["warnungen"]:
              print(f"  ! {w}")
          for m in d["meldungen"][:10]:
              print(f"  ! {m}")
          EOF
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Ein Strich je Monat, mitversioniert. Er ist fuer sich nuetzlich - die
      # einzige Stelle, an der sich der Bestand ueber Jahre zurueckverfolgen
      # laesst - und haelt nebenbei den Zeitplan am Leben: GitHub schaltet
      # zeitgesteuerte Laeufe in oeffentlichen Projekten ab, wenn 60 Tage lang
      # niemand ins Projekt geschrieben hat. Die Laeufe selbst zaehlen nicht.
      - name: Chronik veröffentlichen
        run: |
          if [ -z "$(git status --porcelain -- data/chronik.jsonl)" ]; then
            echo "Chronik unverändert - dieser Monat steht schon drin"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chronik.jsonl
          git commit -m "Chronik: Stand $(date -u +%Y-%m)"
          git push

      # Wenn die Chronik den Zeitplan doch nicht am Leben haelt, soll das
      # auffallen, bevor der Lauf abgeschaltet wird - und nicht erst dadurch,
      # dass er wochenlang nicht mehr laeuft. GitHub kuendigt die Abschaltung
      # zwar per E-Mail an, aber die liest man leicht weg.
      - name: Steht das Projekt still?
        if: always()
        run: |
          TAGE=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Letzter Schreibvorgang vor $TAGE Tagen." >> "$GITHUB_STEP_SUMMARY"
          if [ "$TAGE" -gt 40 ]; then
            echo "::warning::Seit $TAGE Tagen wurde nichts ins Projekt geschrieben. GitHub schaltet den Zeitplan nach 60 Tagen ab - die Chronik scheint ihn nicht am Leben zu halten."
          fi

      - name: CSV- und JSON-Ausgaben mitveröffentlichen
        run: |
          mkdir -p site/daten
          cp data/festivals.csv data/lineups.csv data/bands.csv \
             data/festivals.json data/uebersicht.html data/lauf.json site/daten/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
